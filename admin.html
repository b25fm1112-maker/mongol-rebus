<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mongol Rebus Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Admin: same tokens as the game, denser layout. Pack chips on top, puzzle grid below, editor as a sheet. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EAEEF5; --line:#DCE2EC;
  --ink:#13203B; --muted:#5E6880; --faint:#8A93A8;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --gold:#D9950B; --gold-soft:#FFF3D6;
  --good:#11845B; --good-soft:#E2F5EC; --bad:#C2364B; --bad-soft:#FCE8EB;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1220; --surface:#151C2E; --sunk:#1C2539; --line:#28324A;
  --ink:#E8ECF5; --muted:#A1AAC0; --faint:#737D96;
  --accent:#7DA2FF; --accent-ink:#0B1226; --accent-soft:#1E2B4D;
  --gold:#F2B544; --gold-soft:#3A2E14;
  --good:#4FD39A; --good-soft:#123527; --bad:#FF7D90; --bad-soft:#3D1A22; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mark{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark b{color:var(--accent)} .mark small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgb(15 25 55 / .06),0 6px 18px rgb(15 25 55 / .05)}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:15px;color:var(--ink);font-weight:500}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent)}
.help{font-size:12px;color:var(--faint);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}

/* login */
.login{max-width:460px;margin:8vh auto 0}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}

/* packs */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.chip img{width:40px;height:30px;border-radius:7px;object-fit:cover;background:var(--sunk)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.add{padding:6px 14px;color:var(--accent);border-style:dashed}
.chip small{color:var(--faint);font-weight:600}
.packhead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.packhead .cov{width:100%;aspect-ratio:4/3;border-radius:14px;object-fit:cover;background:var(--sunk);display:block}
@media (max-width:640px){.packhead{grid-template-columns:1fr}.packhead .cov{max-width:320px}}
.lvl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.kindtag{display:inline-block;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);border-radius:99px;padding:3px 9px}
details.settings{margin-top:12px}
details.settings summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style:none}
details.settings summary::-webkit-details-marker{display:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.item{background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgb(15 25 55 / .06);border:0;padding:0;text-align:left}
.item .th{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:2/1;background:var(--sunk)}
.item .th.one{grid-template-columns:1fr}
.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .th .code{display:grid;place-items:center;background:#fff;color:#13203B;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;padding:6px;text-align:center;overflow-wrap:anywhere}
.item .meta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.item strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .badge{align-self:flex-start;margin-top:4px;font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 8px}
.item.newone{outline:2px dashed var(--accent);outline-offset:-2px;display:grid;place-items:center;min-height:150px;color:var(--accent);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(8 12 24 / .55);display:flex;justify-content:center;align-items:flex-end;z-index:20;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:min(720px,100%);max-height:100%;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.sheet{border-radius:20px;max-height:92vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-family:var(--display);font-size:18px}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:10px;font-size:18px;line-height:1}
.drops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.drops.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.drops{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drop{position:relative;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.drop .box{position:relative;aspect-ratio:1/1;border-radius:14px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;text-align:center;padding:8px;color:var(--faint);font-size:12px;font-weight:600;cursor:pointer}
.drop.wide .box{aspect-ratio:16/10}
.drop .box.has{border:0;padding:0}
.drop .box img{width:100%;height:100%;object-fit:cover;display:block}
.drop.wide .box img,.drop.fit .box img{object-fit:contain;background:#fff}
.drop .box.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .clear{position:absolute;top:30px;right:6px;z-index:2;border:0;border-radius:8px;background:rgb(0 0 0 / .6);color:#fff;font-size:12px;padding:3px 8px}
.sheet-f{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}

/* publish bar */
.pub{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);box-shadow:0 -6px 24px rgb(10 20 50 / .12);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pub span{font-weight:600}
.pub .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="pub"></div>
<div id="toast"></div>

<script>
/* ================= config ================= */
const DEFAULT_REPO='b25fm1112-maker/mongol-rebus';
const BRANCH='main';
const DATA_PATH='data/puzzles.json';
const LEVELS=[{id:'easy',name:'Хялбар',age:'6+'},{id:'medium',name:'Дунд',age:'8+'},{id:'advanced',name:'Ахисан',age:'12+'}];
const KINDS={
  pair:{name:'Хоёр зураг + хариулт',desc:'Хоёр сэжүүр зураг нийлж нэг хариулт болно',prompt:'Хоёр зургийг нийлүүлээд нэг үг болго',placeholder:'Монгол эсвэл англиар'},
  rebus:{name:'Ребус зураг',desc:'Үсэг, үгийн байрлалаар хийсэн таавар',prompt:'Байрлал, давталт, хэлбэрийг ажигла',placeholder:'Англи эсвэл монголоор'},
  song:{name:'Эгшиггүй үг',desc:'Эгшгийг нь хассан нэр (дуу, кино г.м.)',prompt:'Эгшгийг нөхөөд нэрийг ол',placeholder:'Нэрийг бичнэ үү'}
};
const PALETTE=[[[214,232,255],[150,190,250]],[[210,243,226],[130,205,170]],[[255,229,204],[245,170,120]],[[228,222,255],[160,145,240]],[[255,222,232],[240,140,170]],[[255,240,190],[240,195,80]],[[214,244,248],[110,200,215]],[[236,236,240],[170,175,190]]];

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const store={get(k,d){try{const v=localStorage.getItem('mra:'+k)??sessionStorage.getItem('mra:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v,persist=true){try{(persist?localStorage:sessionStorage).setItem('mra:'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('mra:'+k);sessionStorage.removeItem('mra:'+k)}catch(e){}}};
const VOWELS=/[аэиоуөүыяеёюАЭИОУӨҮЫЯЕЁЮ\s]/g;
const consonants=s=>String(s).replace(VOWELS,'').replace(/[ьъЬЪ]/g,'').toLocaleUpperCase('mn-MN');
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function toast(msg,bad){const t=$('toast');t.innerHTML=`<div class="toast${bad?' bad':''}" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML='',bad?6000:3500)}

/* ================= state ================= */
const A={
  token:store.get('token',''), repo:store.get('repo',DEFAULT_REPO),
  data:null, original:null, dirty:false, sel:null, newFiles:new Map(), // path -> {blob, url}
  busy:false
};
const fileUrl=p=>A.newFiles.get(p)?.url||p;

/* ================= GitHub API ================= */
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+A.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err}
  return r.status===204?null:r.json();
}
const b64ToUtf8=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const blobToB64=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)});

async function login(token,repo,persist){
  A.token=token.trim();A.repo=repo.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
  const info=await gh(`/repos/${A.repo}`);
  if(!info.permissions?.push)throw new Error('Энэ token-оор repo-д бичих эрх алга. Token үүсгэхдээ Contents: Read and write сонгоно уу.');
  const f=await gh(`/repos/${A.repo}/contents/${DATA_PATH}?ref=${BRANCH}&t=${Date.now()}`);
  A.data=JSON.parse(b64ToUtf8(f.content));A.original=JSON.stringify(A.data);
  store.set('token',A.token,persist);store.set('repo',A.repo);
  A.sel=A.data.packs[0]?.id||null;A.dirty=false;A.newFiles.clear();
}
function logout(){if(A.dirty&&!logout.ok){logout.ok=true;toast('Нийтлээгүй өөрчлөлт байна. Дахин дарвал устгагдана.',true);return}
  store.del('token');A.token='';A.data=null;A.dirty=false;logout.ok=false;render()}

/* ================= image processing ================= */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Зургийг уншиж чадсангүй'));im.src=src})}
async function canvasBlob(cv){
  let b=await new Promise(r=>cv.toBlob(r,'image/webp',.82));
  if(!b||b.type!=='image/webp')b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86));
  return b;
}
/* mode: 'square' crop to 1:1 (clue tiles), 'fit' keep aspect (answers, rebus) */
async function processImage(file,mode){
  const url=URL.createObjectURL(file);
  try{
    const im=await loadImg(url);
    let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight,W,H;
    if(mode==='square'){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;W=H=Math.min(640,s)}
    else{const k=Math.min(1,1000/Math.max(sw,sh));W=Math.round(sw*k);H=Math.round(sh*k)}
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,W,H);c.imageSmoothingQuality='high';c.drawImage(im,sx,sy,sw,sh,0,0,W,H);
    return addFile(await canvasBlob(cv));
  }finally{URL.revokeObjectURL(url)}
}
function addFile(blob){
  const ext=blob.type==='image/webp'?'webp':'jpg';
  const path=`images/${Date.now().toString(36)}${uid()}.${ext}`;
  A.newFiles.set(path,{blob,url:URL.createObjectURL(blob)});
  return path;
}

/* ================= cover (same template as the existing covers) ================= */
let fontReady=null;
function ensureFont(){return fontReady??=(document.fonts?.load?Promise.all([document.fonts.load('800 80px Unbounded'),document.fonts.load('800 64px Unbounded')]).catch(()=>{}):Promise.resolve())}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCover(c,src,x,y,w,h,fit){
  const iw=src.naturalWidth,ih=src.naturalHeight;
  if(fit){const k=Math.min(w/iw,h/ih),dw=iw*k,dh=ih*k;c.drawImage(src,x+(w-dw)/2,y+(h-dh)/2,dw,dh);return}
  const k=Math.max(w/iw,h/ih),sw=w/k,sh=h/k;c.drawImage(src,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);
}
async function makeCover(pack){
  await ensureFont();
  const it=pack.items.find(x=>x.id===pack.coverItem)||pack.items[0];
  const [c1,c2]=pack.colors||PALETTE[0];
  const W=800,H=600,CX=70,CY=95,CW=660,CH=410,R=34,P=22;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(c1));g.addColorStop(1,rgb(c2));c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.43)';c.font='800 64px Unbounded, sans-serif';c.textBaseline='top';
  [[18,10],[712,8],[30,500],[720,505]].forEach(([x,y])=>c.fillText('?',x,y));
  c.save();c.shadowColor='rgba(20,30,70,.28)';c.shadowBlur=36;c.shadowOffsetY=14;rr(c,CX,CY,CW,CH,R);c.fillStyle='#fff';c.fill();c.restore();
  if(it){
    if(pack.kind==='pair'&&it.clues?.length===2){
      const G=56,tw=(CW-2*P-G)/2,th=CH-2*P;
      for(let k=0;k<2;k++){const im=await loadImg(fileUrl(it.clues[k]));const x=k?CX+CW-P-tw:CX+P;
        c.save();rr(c,x,CY+P,tw,th,22);c.clip();drawCover(c,im,x,CY+P,tw,th);c.restore()}
      const mx=CX+CW/2,my=CY+CH/2;c.fillStyle='#13203B';c.beginPath();c.arc(mx,my,30,0,7);c.fill();
      c.strokeStyle='#fff';c.lineWidth=7;c.beginPath();c.moveTo(mx-14,my);c.lineTo(mx+14,my);c.moveTo(mx,my-14);c.lineTo(mx,my+14);c.stroke();
    }else if(pack.kind==='rebus'&&it.q){
      const im=await loadImg(fileUrl(it.q));c.save();rr(c,CX+P,CY+P,CW-2*P,CH-2*P,14);c.clip();drawCover(c,im,CX+P,CY+P,CW-2*P,CH-2*P,true);c.restore();
    }else if(pack.kind==='song'){
      const s=it.code||consonants(it.a);let size=110;c.textBaseline='middle';c.textAlign='center';
      do{c.font=`800 ${size}px Unbounded, sans-serif`;size-=4}while(c.measureText(s).width>CW-90&&size>36);
      c.fillStyle='#13203B';c.fillText(s,CX+CW/2,CY+CH/2+4);
    }
  }
  return addFile(await canvasBlob(cv));
}

/* ================= render ================= */
function render(){
  if(!A.data){$('app').innerHTML=loginView();$('pub').innerHTML='';return}
  $('app').innerHTML=mainView();renderPub();
}
function loginView(){
  return `<div class="login stack">
    <div class="mark">MONGOL <b>REBUS</b><small>Admin</small></div>
    <div class="card stack">
      <h2 style="font-size:18px">Нэвтрэх</h2>
      <p class="muted" style="margin:0">Таавар нэмэхэд GitHub-ийн token хэрэгтэй. Token нь зөвхөн энэ төхөөрөмж дээр хадгалагдана.</p>
      <form class="stack" onsubmit="event.preventDefault();doLogin()">
        <label class="f">GitHub token<input class="i" id="tok" type="password" autocomplete="off" value="${esc(A.token)}" placeholder="github_pat_…" required></label>
        <label class="f">Repo<input class="i" id="repo" value="${esc(A.repo)}" required></label>
        <label class="row faint" style="gap:8px"><input type="checkbox" id="remember" checked> Энэ төхөөрөмж дээр сануулах</label>
        <div class="err" id="lerr"></div>
        <button class="btn" id="lbtn" type="submit">Нэвтрэх</button>
      </form>
    </div>
    <details class="card"><summary style="cursor:pointer;font-weight:700">Token яаж авах вэ?</summary>
      <ol class="steps" style="margin-top:10px">

/* ================= publish: one commit with JSON + new images, unused images removed ================= */
function referenced(data){const s=new Set();for(const p of data.packs){if(p.cover)s.add(p.cover);for(const it of p.items){[it.q,it.ans,...(it.clues||[])].forEach(x=>x&&s.add(x))}}return s}
async function publish(){
  if(A.busy)return;A.busy=true;renderPub();
  try{
    for(const p of A.data.packs){if((p.coverDirty||!p.cover)&&p.items.length){p.cover=await makeCover(p)}delete p.coverDirty}
    const used=referenced(A.data),before=referenced(JSON.parse(A.original));
    const ref=await gh(`/repos/${A.repo}/git/ref/heads/${BRANCH}`);
    const head=await gh(`/repos/${A.repo}/git/commits/${ref.object.sha}`);
    const tree=[];
    for(const [path,f] of A.newFiles){if(!used.has(path))continue;
      const b=await gh(`/repos/${A.repo}/git/blobs`,{method:'POST',body:JSON.stringify({content:await blobToB64(f.blob),encoding:'base64'})});
      tree.push({path,mode:'100644',type:'blob',sha:b.sha})}
    for(const path of before)if(!used.has(path)&&path.startsWith('images/'))tree.push({path,mode:'100644',type:'blob',sha:null});
    const json=JSON.stringify({version:1,updated:new Date().toISOString(),packs:A.data.packs},null,1);
    tree.push({path:DATA_PATH,mode:'100644',type:'blob',content:json});
    const t=await gh(`/repos/${A.repo}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:head.tree.sha,tree})});
    const n=A.newFiles.size;
    const cm=await gh(`/repos/${A.repo}/git/commits`,{method:'POST',body:JSON.stringify({message:`Admin: таавар шинэчлэв (${A.data.packs.reduce((s,p)=>s+p.items.length,0)} таавар)`,tree:t.sha,parents:[ref.object.sha]})});
    await gh(`/repos/${A.repo}/git/refs/heads/${BRANCH}`,{method:'PATCH',body:JSON.stringify({sha:cm.sha})});
    A.original=JSON.stringify(A.data);A.dirty=false;
    toast('Нийтэллээ. Сайт 1–2 минутын дараа шинэчлэгдэнэ.');
  }catch(e){
    toast('Нийтэлж чадсангүй: '+(e.status===401?'token-ий хугацаа дууссан байна, дахин нэвтэрнэ үү':e.status===409?'repo өөрчлөгдсөн байна, хуудсаа дахин ачаална уу':e.message),true);
  }finally{A.busy=false;render()}
}
window.addEventListener('beforeunload',e=>{if(changeCount()){e.preventDefault();e.returnValue=''}});

/* ================= boot ================= */
(async()=>{
  if(A.token){$('app').innerHTML='<p class="muted" style="text-align:center;padding:60px 0">Ачаалж байна…</p>';
    try{await login(A.token,A.repo,!!localStorage.getItem('mra:token'))}catch(e){A.data=null;if(e.status===401)store.del('token')}}
  render();
})();
</script>
