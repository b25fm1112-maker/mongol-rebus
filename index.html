<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mongol Rebus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column (max 560px). Puzzle is the hero of every screen; everything else steps back. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EAEEF5; --line:#DCE2EC;
  --ink:#13203B; --muted:#5E6880; --faint:#8A93A8;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --gold:#D9950B; --gold-soft:#FFF3D6;
  --good:#11845B; --good-soft:#E2F5EC; --bad:#C2364B; --bad-soft:#FCE8EB;
  --paper:#FFFFFF;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2E; --sunk:#1C2539; --line:#28324A;
  --ink:#E8ECF5; --muted:#A1AAC0; --faint:#737D96;
  --accent:#7DA2FF; --accent-ink:#0B1226; --accent-soft:#1E2B4D;
  --gold:#F2B544; --gold-soft:#3A2E14;
  --good:#4FD39A; --good-soft:#123527; --bad:#FF7D90; --bad-soft:#3D1A22;
  --paper:#F7F8FB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --sunk:#1C2539; --line:#28324A;
  --ink:#E8ECF5; --muted:#A1AAC0; --faint:#737D96;
  --accent:#7DA2FF; --accent-ink:#0B1226; --accent-soft:#1E2B4D;
  --gold:#F2B544; --gold-soft:#3A2E14;
  --good:#4FD39A; --good-soft:#123527; --bad:#FF7D90; --bad-soft:#3D1A22;
  --paper:#F7F8FB; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- Home ---------- */
.brand{display:flex;flex-direction:column;gap:6px;padding:18px 2px 22px}
.mark{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,42px);line-height:1;letter-spacing:-.02em}
.mark b{color:var(--accent);font-weight:800}
.mark .sq{display:inline-grid;place-items:center;width:.82em;height:.82em;margin-left:.08em;border-radius:.2em;background:var(--gold);color:#1a1300;font-size:.62em;vertical-align:.08em;transform:rotate(-6deg)}
.tagline{color:var(--muted);font-size:15px;max-width:38ch}

.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--sunk);border-radius:14px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(10 20 50 / .12)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.teams label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.teams input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:15px;color:var(--ink);font-weight:600}
.teams input:focus{outline:none;border-color:var(--accent)}
.teamnote{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}

.level{margin-top:28px}
.level-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 10px}
.level-h h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em}
.level-h span{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}
.pack{display:flex;flex-direction:column;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:0;overflow:hidden;box-shadow:0 1px 2px rgb(15 25 55 / .06),0 6px 18px rgb(15 25 55 / .06);transition:transform .15s,box-shadow .15s}
.pack:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgb(15 25 55 / .08),0 12px 26px rgb(15 25 55 / .1)}
.pack:active{transform:scale(.985)}
.cover{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.pack-t{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px;min-width:0}
.lvl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lvl.medium{color:var(--good)}.lvl.advanced{color:var(--gold)}
.pack-t strong{font-size:16px;font-weight:700;line-height:1.25}
.pack-t small{color:var(--muted);font-size:13px;line-height:1.35}
.pack-n{font-size:12px;color:var(--faint);font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:360px){.packs{grid-template-columns:1fr}}
.foot{margin-top:34px;color:var(--faint);font-size:12px;text-align:center}

/* ---------- Play ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{border:0;background:var(--sunk);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.bar-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar-top .who{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s ease}
.chips{display:flex;gap:6px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip.score{color:var(--gold)}

.card{background:var(--surface);border-radius:22px;box-shadow:0 1px 2px rgb(15 25 55 / .06),0 8px 24px rgb(15 25 55 / .06);padding:18px;display:flex;flex-direction:column;gap:14px}
.prompt{font-size:13px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.01em}
.clues{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center;gap:6px}
.tile{aspect-ratio:1/1;width:100%;max-width:100%;border-radius:16px;overflow:hidden;background:var(--sunk);display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .emo{font-size:clamp(52px,16vw,84px);line-height:1}
.plus{font-family:var(--display);font-weight:700;font-size:24px;color:var(--faint);text-align:center}
.paper{background:var(--paper);border-radius:16px;min-height:200px;display:grid;place-items:center;overflow:hidden}
.paper img{width:100%;height:auto;max-height:340px;display:block;object-fit:contain}
.paper .code{padding:28px 16px}
.code{font-family:var(--display);font-weight:800;color:#13203B;font-size:clamp(26px,8vw,44px);letter-spacing:.08em;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.code.long{font-size:clamp(20px,6vw,32px)}
.meta{text-align:center;font-size:13px;color:var(--faint)}

.answer-form{display:flex;gap:8px;margin-top:16px}
.answer-form input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:17px;color:var(--ink)}
.answer-form input:focus{outline:none;border-color:var(--accent)}
.answer-form input.wrong{border-color:var(--bad);animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.feedback{min-height:22px;margin:8px 2px 0;font-size:14px;font-weight:600;color:var(--bad)}
.hint{margin-top:4px;padding:11px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.hint b{color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.tool{border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:8px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.tool:hover{background:var(--sunk);color:var(--ink)}
.tool small{font-weight:600;color:var(--faint)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px}
.confirm span{flex:1;min-width:140px}
.confirm button{border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.confirm .yes{background:var(--ink);color:var(--bg)}
.confirm .no{background:transparent;color:var(--muted)}

/* Reveal */
.reveal{animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{display:flex;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.ans-img{border-radius:16px;overflow:hidden;background:var(--sunk)}
.ans-img img{width:100%;height:auto;max-height:320px;display:block;object-fit:cover}
.ans-word{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,32px);line-height:1.15;text-align:center;letter-spacing:-.01em}
.ans-sub{text-align:center;color:var(--muted);font-size:16px;margin-top:-6px}
.speak{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.speak svg{width:18px;height:18px;color:var(--accent)}
.speak[data-on="1"]{border-color:var(--accent);background:var(--accent-soft)}
.next{margin-top:16px}
.kbd{display:block;text-align:center;margin-top:8px;font-size:12px;color:var(--faint)}

/* ---------- End / handoff ---------- */
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 6px 6px}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:14px}
.stat{background:var(--sunk);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:18px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:12px}
.res{border:1.5px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.res.win{border-color:var(--gold);background:var(--gold-soft)}
.res h3{font-size:15px;overflow-wrap:anywhere}
.res .pts{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.crown{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;min-height:18px}

@media (max-width:400px){.card{padding:14px}.clues{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:4px}.chip{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
let PACKS=[];

const LEVELS=[
  {id:'easy',name:'Хялбар',age:'6+'},
  {id:'medium',name:'Дунд',age:'8+'},
  {id:'advanced',name:'Ахисан',age:'12+'}
];
const ICON={
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" fill-opacity=".15"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  skip:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l8 7-8 7zM17 5v14"/></svg>',
  solo:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  team:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3.4"/><circle cx="17" cy="9" r="2.8"/><path d="M2 20c1-3.4 3.4-5.2 6-5.2s5 1.8 6 5.2M14.5 15.2c.8-.4 1.6-.6 2.5-.6 2.2 0 4 1.5 5 4.4"/></svg>'
};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>p?String(p):'';
const norm=s=>String(s).toLocaleLowerCase('mn-MN').replace(/ө/g,'о').replace(/ү/g,'у').replace(/ё/g,'е').replace(/&/g,'and').replace(/[^\p{L}\p{N}]+/gu,'');
/* Cyrillic → Latin, then a loose Latin skeleton so "itgel yum shuu", "itgel iym shuu" and "Итгэл юм шүү" all meet. */
const CYR={а:'a',б:'b',в:'v',г:'g',д:'d',е:'ye',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'i',э:'e',ю:'yu',я:'ya'};
const skel=s=>norm(s).replace(/[а-яёөү]/g,c=>CYR[c]??c).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/kh/g,'h').replace(/ts/g,'c').replace(/q/g,'k').replace(/w/g,'v').replace(/y/g,'i').replace(/(.)\1+/g,'$1');
function answers(p,it){return [it.a,it.en,it.mn,...(it.alt||[])].filter(Boolean)}
function isRight(v,p,it){const n=norm(v),k=skel(v);if(!n)return false;return answers(p,it).some(a=>norm(a)===n||(k.length>2&&skel(a)===k))}
const fmt=ms=>{const n=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('mr:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mr:'+k,JSON.stringify(v))}catch(e){}}};
const packById=id=>PACKS.find(p=>p.id===id);

/* ---------- state ---------- */
const S={
  screen:'home', mode:store.get('mode','solo'), teamNames:store.get('teams',['Баг 1','Баг 2']),
  pack:null, items:[], team:0, results:[],
  i:0, score:0, correct:0, hinted:0, revealedN:0, skipped:0,
  elapsed:0, t0:null, done:false, revealed:false, hint:false, gained:0, confirmSkip:false
};
function now(){return S.elapsed+(S.t0==null?0:performance.now()-S.t0)}
function pause(){if(S.t0!=null){S.elapsed+=performance.now()-S.t0;S.t0=null}}
function resume(){if(S.t0==null)S.t0=performance.now()}
function resetRound(){Object.assign(S,{i:0,score:0,correct:0,hinted:0,revealedN:0,skipped:0,elapsed:0,t0:null,done:false,revealed:false,hint:false,gained:0,confirmSkip:false})}

/* ---------- speech (handles late-loading voices on iOS/Android) ---------- */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.addEventListener?.('voiceschanged',loadVoices)}
function speak(text,btn){
  if(!('speechSynthesis' in window)){if(btn)btn.textContent='Энэ төхөөрөмж дуудлага дэмжихгүй';return}
  const ss=speechSynthesis;
  if(ss.speaking||ss.pending)ss.cancel();
  if(!VOICES.length)loadVoices();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  const en=VOICES.filter(v=>/^en[-_]/i.test(v.lang));
  const v=en.find(v=>/natural|premium|enhanced|google|samantha|microsoft/i.test(v.name))||en[0];
  if(v)u.voice=v;
  if(btn){btn.dataset.on='1';u.onend=u.onerror=()=>{btn.dataset.on='0'}}
  ss.resume();ss.speak(u);
}

/* ---------- screens ---------- */
function render(){
  const a=$('app');
  if(S.screen==='home')a.innerHTML=homeView();
  else if(S.screen==='play')a.innerHTML=playView();
  else if(S.screen==='handoff')a.innerHTML=handoffView();
  else if(S.screen==='end')a.innerHTML=endView();
  window.scrollTo({top:0});
  if(S.screen==='play'){
    if(!S.done){const f=$('answer');if(f&&matchMedia('(hover:hover)').matches)f.focus({preventScroll:true})}
    else{const n=$('nextBtn');if(n)n.focus({preventScroll:true})}
  }
}

function homeView(){
  const team=S.mode==='team';
  return `
  <header class="brand">
    <div class="mark">MONGOL <b>REBUS</b><span class="sq">?</span></div>
    <p class="tagline" style="margin:0">Зураг, үсэг, үгийн байрлалд нуугдсан тааврыг ол. Ганцаараа эсвэл багаар.</p>
  </header>
  <div class="seg" role="group" aria-label="Тоглох горим">
    <button aria-pressed="${!team}" onclick="setMode('solo')">${ICON.solo}Ганцаараа</button>
    <button aria-pressed="${team}" onclick="setMode('team')">${ICON.team}2 баг</button>
  </div>
  ${team?`<div class="teams">
    <label for="t0">Эхний баг<input id="t0" maxlength="20" value="${esc(S.teamNames[0])}" oninput="setTeam(0,this.value)"></label>
    <label for="t1">Хоёр дахь баг<input id="t1" maxlength="20" value="${esc(S.teamNames[1])}" oninput="setTeam(1,this.value)"></label>
    <p class="teamnote">Баг бүр ижил таавруудыг ээлжлэн бодно. Оноо их нь ялна, тэнцвэл хурдан нь.</p>
  </div>`:''}
  <div class="packs">${PACKS.filter(p=>p.items.length).map(p=>{
    const l=LEVELS.find(x=>x.id===p.level),best=store.get('best:'+p.id,null);
    return `<button class="pack" onclick="start('${p.id}')">
      <img class="cover" src="${img(p.cover)}" alt="" loading="lazy">
      <span class="pack-t"><span class="lvl ${l.id}">${l.name} · ${l.age}</span><strong>${esc(p.name)}</strong><small>${esc(p.desc||'')}</small><span class="pack-n">${p.items.length} таавар${best!=null?` · <span class="best">★ ${best}</span>`:''}</span></span>
    </button>`}).join('')}</div>
  <p class="foot">Хариултаа монгол эсвэл англиар бичиж болно<br>Зөв +10 · Сэжүүртэй +5 · Хариулт харсан, алгассан 0</p>`;
}

function puzzleBody(p,it){
  let body='';
  if(p.kind==='song'){
    body=`<div class="paper"><div class="code${it.code.length>10?' long':''}">${esc(it.code)}</div></div>`;
  }else if(p.kind==='rebus'){
    body=`<div class="paper"><img src="${img(it.q)}" alt="Англи ребус таавар"></div>`;
  }else{
    body=`<div class="clues">${(it.clues||[]).map((c,k)=>`${k?'<div class="plus" aria-hidden="true">+</div>':''}<div class="tile"><img src="${img(c)}" alt="Сэжүүр ${k+1}" draggable="false"></div>`).join('')}</div>`;
  }
  let meta='';
  if(it.showWords)meta=`Хариулт ${it.a.trim().split(/\s+/).length} үгтэй`;
  else if(p.kind==='song')meta=`${it.a.trim().split(/\s+/).length} үгтэй нэр`;
  return `<p class="prompt" style="margin:0">${esc(p.prompt||'')}</p>${body}${meta?`<div class="meta">${meta}</div>`:''}`;
}
function hintText(p,it){
  if(p.kind==='song')return it.artist;
  if(it.hint)return it.hint;
  const letters=it.a.replace(/\s/g,'').length;
  return `Эхний үсэг «${it.a[0].toUpperCase()}» · нийт ${letters} үсэг`;
}
function revealBody(p,it){
  const verdict=S.revealed?`<span class="pill neutral">Хариулт</span>`:`<span class="pill good">Зөв! +${S.gained}</span>`;
  let pic='';
  if(p.kind==='song')pic=`<div class="paper"><div class="code${it.code.length>10?' long':''}" style="opacity:.35">${esc(it.code)}</div></div>`;
  else if(it.ans)pic=`<div class="ans-img"><img src="${img(it.ans)}" alt="${esc(it.a)}"></div>`;
  const sub=p.kind==='song'?it.artist:p.kind==='rebus'?it.mn:it.en;
  const sayText=p.kind==='rebus'?it.a:it.en;
  return `<div class="reveal stack" style="gap:14px">
    <div class="verdict">${verdict}</div>
    ${pic}
    <div class="ans-word">${esc(it.a)}</div>
    ${sub?`<div class="ans-sub">${esc(sub)}</div>`:''}
    ${p.kind!=='song'&&sayText?`<button class="speak" onclick="speak(${esc(JSON.stringify(sayText))},this)">${ICON.speaker}Англиар сонсох</button>`:''}
  </div>`;
}
function playView(){
  const p=S.pack,it=S.items[S.i],n=S.items.length;
  const pct=Math.round((S.i+(S.done?1:0))/n*100);
  const who=S.mode==='team'?S.teamNames[S.team]:p.name;
  const last=S.i===n-1;
  return `
  <div class="bar">
    <button class="iconbtn" onclick="exitGame()" aria-label="Нүүр рүү буцах">${ICON.close}</button>
    <div class="bar-mid">
      <div class="bar-top"><span class="who">${esc(who)}</span><span>${S.i+1} / ${n}</span></div>
      <div class="track"><i style="width:${pct}%"></i></div>
    </div>
    <div class="chips"><span class="chip"><span id="clock">${fmt(now())}</span></span><span class="chip score">★ ${S.score}</span></div>
  </div>
  <div class="card">${S.done?revealBody(p,it):puzzleBody(p,it)}</div>
  ${S.done?`
    <button id="nextBtn" class="btn block next" onclick="next()">${last?(S.mode==='team'&&S.team===0?'Эхний багийн дүн':'Үр дүн харах'):'Дараагийн таавар'}</button>
    <span class="kbd">Enter дарж үргэлжлүүлнэ</span>`:`
    <form class="answer-form" onsubmit="event.preventDefault();check()">
      <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${esc(p.placeholder||'Хариулт')}" aria-label="Хариулт">
      <button class="btn" type="submit">Шалгах</button>
    </form>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    ${S.hint?`<div class="hint">${ICON.bulb}<span><b>Сэжүүр:</b> ${esc(hintText(p,it))}</span></div>`:''}
    ${S.confirmSkip?`<div class="confirm"><span>Энэ тааврыг алгасах уу? Оноо авахгүй.</span><button class="no" onclick="S.confirmSkip=false;render()">Үгүй</button><button class="yes" onclick="skip()">Алгасах</button></div>`:`
    <div class="tools">
      ${S.hint?'':`<button class="tool" onclick="showHint()">${ICON.bulb}Сэжүүр <small>−5</small></button>`}
      <button class="tool" onclick="reveal()">${ICON.eye}Хариулт харах</button>
      <button class="tool" onclick="S.confirmSkip=true;render()">${ICON.skip}Алгасах</button>
    </div>`}`}`;
}
function statsRow(r){return `<div class="stats"><div class="stat"><b>${r.correct}</b><span>Зөв</span></div><div class="stat"><b>${fmt(r.elapsed)}</b><span>Хугацаа</span></div><div class="stat"><b>${r.revealed+r.skipped}</b><span>Оноогүй</span></div></div>`}
function handoffView(){
  const r=S.results[0];
  return `<div class="card"><div class="center">
    <span class="eyebrow">Эхний баг дууслаа</span>
    <h1 style="font-size:22px">${esc(r.name)}</h1>
    <div class="big">${r.score}</div><span class="meta">оноо</span>
    ${statsRow(r)}
    <p class="meta" style="margin:10px 0 0;max-width:34ch">Утсаа <b style="color:var(--ink)">${esc(S.teamNames[1])}</b> багт өг. Хугацаа тэднийг эхлэх үед л явж эхэлнэ.</p>
    <div class="actions"><button class="btn block" onclick="beginTeam2()">${esc(S.teamNames[1])}: эхлэх</button></div>
  </div></div>`;
}
function endView(){
  const p=S.pack;
  if(S.mode==='team'){
    const [a,b]=S.results;
    const w=a.score!==b.score?(a.score>b.score?0:1):(a.elapsed===b.elapsed?-1:(a.elapsed<b.elapsed?0:1));
    return `<div class="card"><div class="center">
      <span class="eyebrow">${esc(p.name)} · тэмцээн дууслаа</span>
      <h1 style="font-family:var(--display);font-size:26px">${w<0?'Тэнцлээ':esc(S.results[w].name)+' яллаа'}</h1>
      <div class="results">${S.results.map((r,k)=>`<div class="res ${w===k?'win':''}"><span class="crown">${w===k?'★ Ялагч':''}</span><h3>${esc(r.name)}</h3><span class="pts">${r.score}</span><small>${r.correct} зөв · ${fmt(r.elapsed)}</small></div>`).join('')}</div>
      ${a.score===b.score&&w>=0?'<p class="meta" style="margin:0">Оноо тэнцсэн тул хурдан бодсон баг ялав.</p>':''}
      <div class="actions"><button class="btn block" onclick="start('${p.id}')">Дахин тоглох</button><button class="btn ghost block" onclick="go('home')">Өөр багц сонгох</button></div>
    </div></div>`;
  }
  const r=S.results[0],max=S.items.length*10,best=store.get('best:'+p.id,0);
  return `<div class="card"><div class="center">
    <span class="eyebrow">${esc(p.name)}</span>
    <div class="big">${r.score}</div><span class="meta">${max} онооноос${(S._prevBest==null||r.score>S._prevBest)&&r.score>0?' · шинэ дээд амжилт':''}</span>
    ${statsRow(r)}
    <div class="actions"><button class="btn block" onclick="start('${p.id}')">Дахин тоглох</button><button class="btn ghost block" onclick="go('home')">Өөр багц сонгох</button></div>
  </div></div>`;
}

/* ---------- actions ---------- */
function go(s){pause();try{speechSynthesis.cancel()}catch(e){}S.screen=s;render()}
function setMode(m){S.mode=m;store.set('mode',m);render()}
function setTeam(k,v){S.teamNames[k]=v.trim().slice(0,20)||('Баг '+(k+1));store.set('teams',S.teamNames)}
function start(id){
  S.pack=packById(id);if(!S.pack)return;S.items=shuffle(S.pack.items);S.team=0;S.results=[];
  resetRound();S.screen='play';resume();render();
}
function exitGame(){go('home')}
function check(){
  if(S.done)return;
  const f=$('answer'),v=f.value,it=S.items[S.i];
  if(!v.trim()){fb('Хариултаа бичээд Шалгах дарна уу.');return}
  if(isRight(v,S.pack,it)){
    pause();S.gained=S.hint?5:10;S.score+=S.gained;S.correct++;if(S.hint)S.hinted++;
    S.revealed=false;S.done=true;render();
  }else{
    f.classList.remove('wrong');void f.offsetWidth;f.classList.add('wrong');
    fb('Таарсангүй. Дахин оролдоод үзээрэй.');f.select();
  }
}
function fb(t){const e=$('feedback');if(e)e.textContent=t}
function showHint(){S.hint=true;const v=$('answer')?.value||'';render();const f=$('answer');if(f)f.value=v}
function reveal(){if(S.done)return;pause();S.revealedN++;S.revealed=true;S.gained=0;S.done=true;render()}
function skip(){pause();S.skipped++;S.confirmSkip=false;advance()}
function next(){advance()}
function snapshot(){pause();return {name:S.mode==='team'?S.teamNames[S.team]:'',score:S.score,elapsed:S.elapsed,correct:S.correct,hinted:S.hinted,revealed:S.revealedN,skipped:S.skipped}}
function advance(){
  try{speechSynthesis.cancel()}catch(e){}
  if(S.i>=S.items.length-1){
    S.results[S.team]=snapshot();
    if(S.mode==='team'&&S.team===0){S.screen='handoff';render();return}
    if(S.mode==='solo'){const b=store.get('best:'+S.pack.id,null);S._prevBest=b;if(b==null||S.score>b)store.set('best:'+S.pack.id,S.score)}
    S.screen='end';render();return;
  }
  S.i++;S.done=false;S.revealed=false;S.hint=false;S.confirmSkip=false;resume();render();
}
function beginTeam2(){S.team=1;resetRound();S.screen='play';resume();render()}

document.addEventListener('keydown',e=>{
  if(S.screen==='play'&&S.done&&e.key==='Enter'&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();next()}
});
setInterval(()=>{if(S.screen==='play'&&S.t0!=null){const c=$('clock');if(c)c.textContent=fmt(now())}},250);
async function boot(){
  $('app').innerHTML='<p class="meta" style="padding:60px 0">Таавруудыг ачаалж байна…</p>';
  try{
    const r=await fetch('data/puzzles.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    PACKS=(await r.json()).packs||[];
    const lv={easy:0,medium:1,advanced:2};PACKS.sort((a,b)=>(lv[a.level]??3)-(lv[b.level]??3));
    render();
  }catch(e){
    $('app').innerHTML='<div class="card" style="margin-top:40px"><p class="prompt" style="margin:0">Таавруудыг ачаалж чадсангүй. Интернэтээ шалгаад хуудсаа дахин ачаална уу.</p><button class="btn block" onclick="boot()">Дахин оролдох</button></div>';
  }
}
boot();
</script>
</body>
</html>
